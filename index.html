<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>YOKOHAMA | ТСД Контроль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Загрузка библиотеки XLSX: локально из папки ТСД с фолбэком на CDN -->
  <script src="xlsx.full.min.js"></script>
  <script>
    if (typeof XLSX === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #ffffff; padding: 6px; }

    .brand-header {
      background: #181818;
      border-bottom: 3px solid #E60012;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .brand-title { font-size: 17px; font-weight: bold; font-style: italic; color: #ffffff; }
    .brand-sub { font-size: 10px; color: #E60012; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

    .status-bar {
      display: -webkit-box; display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      padding: 6px 10px;
      border: 1px solid #282828;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .badge-sync { padding: 2px 6px; border-radius: 4px; font-size: 10px; background: #242424; color: #aaa; cursor: pointer; }
    .online { color: #00e676; }
    .offline { color: #ff9100; }

    .nav { display: -webkit-box; display: flex; margin-bottom: 8px; background: #1c1c1c; padding: 2px; }
    .nav button {
      -webkit-box-flex: 1; flex: 1;
      padding: 10px 2px;
      background: transparent;
      color: #888888;
      border: none;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .nav button.active { background: #E60012; color: #ffffff; }

    .card {
      background: #161616;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #282828;
    }
    label { font-size: 10px; color: #8e8e8e; margin-top: 6px; display: block; text-transform: uppercase; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 9px;
      margin-top: 3px;
      background: #222222;
      border: 1px solid #383838;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      outline: none;
    }
    input:focus, select:focus { border-color: #E60012; }

    .result-banner {
      margin: 6px 0;
      padding: 12px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      font-style: italic;
      display: none;
      line-height: 1.3;
    }
    .result-banner.OK { background: #0a2f13; color: #69f0ae; border: 2px solid #00e676; }
    .result-banner.FUZZY { background: #3b2c04; color: #ffd54f; border: 2px solid #ffb300; }
    .result-banner.MISMATCH { background: #38080c; color: #ff8a80; border: 2px solid #E60012; }

    .btn-action {
      width: 100%;
      padding: 11px;
      background: #252525;
      color: #eeeeee;
      border: 1px solid #3a3a3a;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-red { background: #E60012; border-color: #E60012; color: #ffffff; }
    .btn-orange { background: #d48806; border-color: #ffd666; color: #000000; }
    .btn-blue { background: #0277bd; border-color: #29b6f6; color: #ffffff; }

    .grid { overflow: hidden; margin-top: 6px; }
    .car-badge {
      float: left;
      width: 23%;
      margin: 1%;
      padding: 10px 2px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      font-style: italic;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-green { background: #135e26; color: #ffffff; border-color: #00e676; }
    .status-red { background: #7a0c14; color: #ffffff; border-color: #E60012; }
    .status-yellow { background: #d48806; color: #000000; border-color: #ffd666; }
    .badge-sub { font-size: 10px; display: block; font-weight: normal; font-style: normal; margin-top: 2px; }

    .sub-nav { display: -webkit-box; display: flex; margin-bottom: 8px; }
    .sub-nav button {
      -webkit-box-flex: 1; flex: 1;
      padding: 8px 2px;
      background: #222222;
      color: #aaaaaa;
      border: 1px solid #333333;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .sub-nav button.active { background: #333333; color: #ffffff; border-color: #E60012; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
    }
    .modal-sheet {
      background: #181818;
      width: 96%;
      max-height: 90%;
      margin: 5% auto;
      padding: 12px;
      border-top: 3px solid #E60012;
      overflow-y: auto;
    }
    .modal-header { overflow: hidden; margin-bottom: 8px; }
    .modal-title { float: left; font-size: 16px; font-weight: bold; font-style: italic; }
    .modal-close { float: right; background: #333333; border: none; color: #ffffff; width: 28px; height: 28px; font-weight: bold; }
    .tire-item {
      background: #222222;
      padding: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      border-left: 3px solid #444444;
      overflow: hidden;
    }
    .tire-item.ok { border-left-color: #00e676; }
    .tire-item.pending { border-left-color: #ffd666; }
    .tire-left { float: left; }
    .tire-right { float: right; }
    .badge-pill { padding: 2px 6px; font-size: 10px; font-weight: bold; }
    .badge-ok { background: #135e26; color: #69f0ae; }
    .badge-pending { background: #423508; color: #ffd666; }
    .clearfix { clear: both; }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-title">YOKOHAMA</div>
    <div class="brand-sub" id="stageTitle">Motorsport Tyre Control</div>
  </div>

  <div class="status-bar">
    <div id="netStatus" class="online">● ОНЛАЙН</div>
    <div id="scannerIdDisplay" style="color:#aaa;">Сканер #1</div>
    <div id="queueStatus" class="badge-sync" onclick="forceSync()">Очередь: 0 ⟳</div>
  </div>

  <div class="nav">
    <button id="tabScanBtn" class="active" onclick="showTab('scan')">Проверка</button>
    <button id="tabListBtn" onclick="showTab('list')">Сетка</button>
    <button id="tabRegBtn" onclick="showTab('reg')">Шины</button>
    <button id="tabStageBtn" onclick="showTab('stage')">Этапы</button>
  </div>

  <!-- 1. ПРОВЕРКА -->
  <div id="tabScan">
    <div class="card">
      <label>Класс:</label>
      <select id="classSelect" onchange="onClassChange()"></select>

      <div id="sessionWrapper" style="display:none;">
        <label>Сессия (GT4):</label>
        <select id="sessionSelect">
          <option value="ALL">Все сессии (без фильтра)</option>
          <option value="S0">S0 — Свободная тренировка (Новые)</option>
          <option value="S1">S1 — Свободная тренировка (Б/у с пред. этапов)</option>
          <option value="S2">S2 — Свободная тренировка (Новые)</option>
          <option value="S3">S3 — Квалификация и Гонка</option>
          <option value="S4">S4 — Квалификация и Гонка</option>
          <option value="JOKER">JOKER — Джокер</option>
        </select>
      </div>

      <label>Номер машины:</label>
      <select id="carSelect"></select>

      <div id="resultBanner" class="result-banner"></div>

      <label>Штрихкод (нажми курок сканера):</label>
      <input type="text" id="barcodeInput" placeholder="Жми курок сканера" autocomplete="off" autocapitalize="off" spellcheck="false">

      <button class="btn-action btn-red" onclick="processManualCheck()">Сверить вручную</button>
    </div>
  </div>

  <!-- 2. СЕТКА МАШИН -->
  <div id="tabList" style="display:none;">
    <div class="card">
      <label>Класс:</label>
      <select id="listClassSelect" onchange="renderCarsGrid()"></select>
      
      <button class="btn-action btn-orange" onclick="resetCurrentClassSession()">
        🔄 Сброс отметок сессии (Класс)
      </button>
    </div>
    <div class="grid" id="carsGrid"></div>
    <div class="clearfix"></div>
  </div>

  <!-- 3. ВНЕСЕНИЕ ШИН И УЧАСТНИКОВ -->
  <div id="tabReg" style="display:none;">
    <div class="card">
      <label>Код доступа техкома:</label>
      <input type="password" id="regPass" placeholder="••••">

      <div class="sub-nav" style="margin-top:8px;">
        <button id="subTabTireBtn" class="active" onclick="showSubTab('tire')">Шина в слот</button>
        <button id="subTabAddCarBtn" onclick="showSubTab('addCar')">+ Машина</button>
        <button id="subTabDelCarBtn" onclick="showSubTab('delCar')">- Машина</button>
        <button id="subTabExtraBtn" onclick="showSubTab('extra')">+ Доп. шина</button>
      </div>

      <!-- Внесение шины в слот -->
      <div id="subBlockTire">
        <label>Класс:</label>
        <select id="regClassSelect" onchange="onRegClassChange()"></select>

        <div id="regSessionWrapper" style="display:none;">
          <label>Сессия (GT4):</label>
          <select id="regSessionSelect">
            <option value="S0">S0 — Свободная тренировка (Новые)</option>
            <option value="S1">S1 — Свободная тренировка (Б/у с пред. этапов)</option>
            <option value="S2">S2 — Свободная тренировка (Новые)</option>
            <option value="S3">S3 — Квалификация и Гонка</option>
            <option value="S4">S4 — Квалификация и Гонка</option>
            <option value="JOKER">JOKER — Джокер</option>
          </select>
        </div>

        <label>Номер машины:</label>
        <select id="regCarSelect"></select>

        <div id="regResultBanner" class="result-banner"></div>

        <label>Штрихкод новой шины (сканируй курком):</label>
        <input type="text" id="regBarcodeInput" placeholder="Сканируй триггером ТСД" autocomplete="off">

        <button class="btn-action btn-red" onclick="submitTireRegistration()">Внести в слот</button>
      </div>

      <!-- ДОБАВЛЕНИЕ МАШИНЫ С ВОЗМОЖНОСТЬЮ СОЗДАТЬ НОВЫЙ КЛАСС -->
      <div id="subBlockAddCar" style="display:none;">
        <label>Класс машины:</label>
        <select id="addCarClassSelect" onchange="onAddCarClassSelectChange()"></select>

        <!-- Поле ввода нового класса -->
        <div id="newClassInputWrapper" style="display:none; background:#222; padding:8px; border-left:3px solid #00e676; margin-top:4px;">
          <label style="color:#00e676;">Название нового класса:</label>
          <input type="text" id="newClassNameInput" placeholder="Например: Спортпрототип CN или Туринг 1600">
        </div>

        <label>Номер машины:</label>
        <input type="number" id="addCarNumber" placeholder="Например, 77">
        <label>Квота шин на этап:</label>
        <select id="addCarTireQuota">
          <option value="6">6 новых шин (Туринг-Лайт / Супер-Продакшн)</option>
          <option value="8">8 новых шин</option>
          <option value="12">12 шин (Туринг)</option>
          <option value="24">24 шины (GT4)</option>
        </select>
        <button class="btn-action btn-red" onclick="submitAddCar()">Добавить в этап</button>
      </div>

      <!-- Удаление машины -->
      <div id="subBlockDelCar" style="display:none;">
        <label>Класс:</label>
        <select id="delCarClassSelect" onchange="updateCarSelect(this.value, 'delCarSelect')"></select>
        <label>Номер машины:</label>
        <select id="delCarSelect"></select>
        <button class="btn-action" style="background:#7a0c14; border-color:#E60012; color:#fff;" onclick="submitDeleteCar()">Удалить из этапа</button>
      </div>

      <!-- Доп. шина -->
      <div id="subBlockExtra" style="display:none;">
        <label>Класс:</label>
        <select id="extraClassSelect" onchange="updateCarSelect(this.value, 'extraCarSelect')"></select>
        <label>Номер машины:</label>
        <select id="extraCarSelect"></select>
        <label>Штрихкод:</label>
        <input type="text" id="extraBarcodeInput" placeholder="Штрихкод колеса">
        <button class="btn-action btn-red" onclick="submitAddExtraTire()">Добавить доп. колесо</button>
      </div>
    </div>
  </div>

  <!-- 4. УПРАВЛЕНИЕ ЭТАПАМИ (GOOGLE + ЛОКАЛЬНЫЙ XLSX) -->
  <div id="tabStage" style="display:none;">
    <div class="card">
      <div style="font-weight:bold; font-size:13px; color:#E60012; border-bottom:1px solid #333; padding-bottom:4px;">
        1. СЕТЬ СКАНИРОВАНИЯ (БРИГАДА ТИ)
      </div>
      <label>Номер / Имя этого сканера:</label>
      <select id="scannerIdSelect" onchange="setScannerId(this.value)">
        <option value="Сканер #1 (Главный)">Сканер #1 (Главный)</option>
        <option value="Сканер #2 (Левый борт)">Сканер #2 (Левый борт)</option>
        <option value="Сканер #3 (Правый борт)">Сканер #3 (Правый борт)</option>
        <option value="Сканер #4 (Пит-лейн)">Сканер #4 (Пит-лейн)</option>
        <option value="Сканер #5 (Выезд)">Сканер #5 (Выезд)</option>
        <option value="Сканер #6 (Боксы)">Сканер #6 (Боксы)</option>
      </select>
      <button class="btn-action btn-blue" onclick="forceSync()">⚡ Синхронизировать с бригадой сейчас</button>
    </div>

    <div class="card">
      <div style="font-weight:bold; font-size:13px; color:#E60012; border-bottom:1px solid #333; padding-bottom:4px;">
        2. СМЕНА СОРЕВНОВАНИЯ / ЭТАПА
      </div>
      
      <!-- Метод А: Из Google Таблицы -->
      <label>Метод А: ID Google Таблицы этапа:</label>
      <input type="text" id="cloudSheetIdInput" placeholder="Введи ID таблицы">
      <button class="btn-action btn-red" onclick="loadStageFromGoogleSheet()">
        ☁ Загрузить этап из Google Таблицы
      </button>

      <!-- Метод Б: Локальный файл XLSX, XLS, CSV или JSON -->
      <label style="margin-top:12px;">Метод Б: Файл с памяти ТСД (.xlsx, .xls, .csv, .json):</label>
      <input type="file" id="localStageFileInput" accept=".xlsx,.xls,.csv,.json" style="padding:4px; font-size:12px;" onchange="importLocalStageFile(event)">

      <button class="btn-action" style="margin-top:10px;" onclick="exportStageToJSON()">
        💾 Сохранить базу этапа (.json)
      </button>
      <button class="btn-action" onclick="exportDataToCSV()">
        📄 Выгрузить лог проверок (CSV/Excel)
      </button>
      <button class="btn-action btn-orange" onclick="createCleanStage()">
        🏁 Начать новый "Чистый этап" (без шин)
      </button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО МАШИНЫ -->
  <div id="carDetailModal" class="modal-overlay" onclick="closeCarModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="modalCarTitle" class="modal-title">Машина #--</div>
        <button class="modal-close" onclick="closeCarModal()">✕</button>
      </div>
      <div id="modalCarSub" style="font-size:12px; color:#aaa; margin-bottom:6px;">Класс: --</div>
      <div id="modalTireList"></div>
      
      <button id="modalResetCarBtn" class="btn-action btn-orange" style="margin-top:8px;">
        🔄 Очистить отметки этой машины
      </button>
      <button id="modalInspectBtn" class="btn-action btn-red" style="margin-top:6px;">
        🔍 Проверить эту машину
      </button>
    </div>
  </div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyC9MW5uiCpXmo1APugPa63jm-TgBX4eKetJOCvpajbnJYDf1rX7pGiBpV9jVuJWhkH/exec';

    function buildDefaultDB() {
      var db = {};
      var gt4Schema = DEFAULT_STAGE_DATA.GT4_SCHEMA;
      for (var cls in DEFAULT_STAGE_DATA) {
        if (cls === 'GT4_SCHEMA') continue;
        db[cls] = {};
        for (var car in DEFAULT_STAGE_DATA[cls]) {
          db[cls][car] = [];
          var arr = DEFAULT_STAGE_DATA[cls][car];
          for (var i = 0; i < arr.length; i++) {
            if (cls === 'GT4') {
              var sInfo = (gt4Schema && gt4Schema[i]) ? gt4Schema[i] : ['S0', 'Шина ' + (i + 1)];
              db[cls][car].push({
                session: sInfo[0],
                slot: sInfo[1],
                barcode: arr[i],
                scanned: '',
                status: ''
              });
            } else if (cls === 'Touring') {
              db[cls][car].push({
                session: '',
                slot: 'Новая шина ' + (i + 1),
                barcode: arr[i],
                scanned: '',
                status: ''
              });
            } else {
              db[cls][car].push({
                session: '',
                slot: 'Шина ' + (i + 1),
                barcode: arr[i],
                scanned: '',
                status: ''
              });
            }
          }
        }
      }
      return { stageName: 'Грозный (РСКГ 2026)', classes: db };
    }

    function initApp() {
      try {
        var stored = window.localStorage ? localStorage.getItem(STORAGE_KEY) : null;
        if (stored) localDB = JSON.parse(stored);
        var storedQueue = window.localStorage ? localStorage.getItem('rskg_queue_v5') : null;
        if (storedQueue) syncQueue = JSON.parse(storedQueue);
        var storedScanId = window.localStorage ? localStorage.getItem('rskg_scanner_id') : null;
        if (storedScanId) myScannerId = storedScanId;
        var storedSheetId = window.localStorage ? localStorage.getItem('rskg_sheet_id') : null;
        if (storedSheetId) activeSheetId = storedSheetId;
      } catch(e) {}

      if (!localDB || !localDB.classes) {
        localDB = buildDefaultDB();
        saveDB();
      }

      document.getElementById('scannerIdSelect').value = myScannerId;
      document.getElementById('scannerIdDisplay').innerText = myScannerId;
      document.getElementById('cloudSheetIdInput').value = activeSheetId;
      document.getElementById('stageTitle').innerText = localDB.stageName || 'Motorsport Tyre Control';

      populateClassSelectors();

      if (bInput) {

            processManualCheck();
          }

        setInterval(function() {

          if (activeTab && activeTab.style.display !== 'none' && document.activeElement !== bInput) {
            var el = document.activeElement;
            if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'SELECT')) {
              bInput.focus();
            }
          }
        }, 1200);
        setTimeout(function() { bInput.focus(); }, 300);
      }

      var regInput = document.getElementById('regBarcodeInput');
      if (regInput) {
        regInput.addEventListener('keypress', function(e) {
          if (e.keyCode === 13 || e.which === 13) {
            e.preventDefault();
            submitTireRegistration();
          }
        });
      }

      setInterval(function() {
        if (navigator.onLine) syncWithCloud();
      }, 8000);

      window.addEventListener('online', function() { updateNetStatus(); syncWithCloud(); });
      window.addEventListener('offline', updateNetStatus);
      updateNetStatus();

    function saveDB() {
      try {
        if (window.localStorage) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(localDB));
          localStorage.setItem('rskg_queue_v5', JSON.stringify(syncQueue));
        }

    function updateNetStatus() {

      try { localStorage.setItem('rskg_scanner_id', id); } catch(e) {}

    function populateClassSelectors() {
      if (!localDB || !localDB.classes) return;
      var classes = [];
      for (var k in localDB.classes) {
        if (localDB.classes.hasOwnProperty(k)) classes.push(k);
      }
      if (classes.length === 0) return;

      var standardIds = ['classSelect', 'listClassSelect', 'regClassSelect', 'delCarClassSelect', 'extraClassSelect'];
      for (var i = 0; i < standardIds.length; i++) {
        var el = document.getElementById(standardIds[i]);
        if (!el) continue;
        var cur = el.value;
        el.innerHTML = '';
        for (var j = 0; j < classes.length; j++) {
          var opt = document.createElement('option');
          opt.value = classes[j];
          opt.text = classes[j];
          el.appendChild(opt);
        }
        if (cur && localDB.classes[cur]) el.value = cur;
      }

      // Настройка селектора добавления машины с опцией создания класса
      var addSel = document.getElementById('addCarClassSelect');
      if (addSel) {
        var addCur = addSel.value;
        addSel.innerHTML = '';
        for (var m = 0; m < classes.length; m++) {
          var optA = document.createElement('option');
          optA.value = classes[m];
          optA.text = classes[m];
          addSel.appendChild(optA);
        }
        var newOpt = document.createElement('option');
        newOpt.value = '__NEW__';
        newOpt.text = '+ [Создать новый класс...]';
        addSel.appendChild(newOpt);

        if (addCur && (localDB.classes[addCur] || addCur === '__NEW__')) {
          addSel.value = addCur;
        }
        onAddCarClassSelectChange();
      }

      onClassChange();
      onRegClassChange();
      updateCarSelect(document.getElementById('delCarClassSelect').value, 'delCarSelect');
      updateCarSelect(document.getElementById('extraClassSelect').value, 'extraCarSelect');
    }

    function onAddCarClassSelectChange() {
      var sel = document.getElementById('addCarClassSelect');
      var wrap = document.getElementById('newClassInputWrapper');
      if (sel && wrap) {
        wrap.style.display = (sel.value === '__NEW__') ? 'block' : 'none';
        if (sel.value === '__NEW__') {
          setTimeout(function() { document.getElementById('newClassNameInput').focus(); }, 100);
        }
      }
    }

    function onClassChange() {
      var cls = document.getElementById('classSelect').value;
      var sessEl = document.getElementById('sessionWrapper');
      sessEl.style.display = (cls.toUpperCase().indexOf('GT4') !== -1) ? 'block' : 'none';
      updateCarSelect(cls, 'carSelect');
    }

    function onRegClassChange() {
      var cls = document.getElementById('regClassSelect').value;
      var sessEl = document.getElementById('regSessionWrapper');
      sessEl.style.display = (cls.toUpperCase().indexOf('GT4') !== -1) ? 'block' : 'none';
      updateCarSelect(cls, 'regCarSelect');
    }

    function updateCarSelect(cls, selectId) {
      var sel = document.getElementById(selectId);
      if (!sel) return;
      sel.innerHTML = '';
      if (!localDB.classes[cls]) return;

      var nums = [];
      for (var k in localDB.classes[cls]) {
        if (localDB.classes[cls].hasOwnProperty(k)) nums.push(k);
      }
      nums.sort(function(a, b) { return Number(a) - Number(b); });

      for (var i = 0; i < nums.length; i++) {
        var opt = document.createElement('option');
        opt.value = nums[i];
        opt.text = '#' + nums[i];
        sel.appendChild(opt);
      }
    }

    function processManualCheck() {
      var bInput = document.getElementById('barcodeInput');
      var val = bInput.value.replace(/[^0-9]/g, '');
      if (val) verifyTire(val);
      bInput.value = '';
      bInput.focus();
    }

    function verifyTire(barcode) {
      var cls = document.getElementById('classSelect').value;
      var car = document.getElementById('carSelect').value;
      var session = document.getElementById('sessionSelect') ? document.getElementById('sessionSelect').value : '';
      var banner = document.getElementById('resultBanner');

      if (!car) {
        alert('Выберите номер машины!');
        return;
      }

      banner.style.display = 'block';
      var cleanScan = String(barcode).trim().replace(/[^0-9]/g, '');
      var carTires = (localDB.classes[cls] && localDB.classes[cls][car]) ? localDB.classes[cls][car] : [];
      var isGT4 = (cls.toUpperCase().indexOf('GT4') !== -1);

      var matchResult = findMatchingTire(cleanScan, carTires, session, isGT4);

      if (matchResult) {
        var t = matchResult.tire;

        if (isGT4 && session && session !== 'ALL' && t.session && t.session !== session) {
          var curDesc = GT4_DESC[t.session] || t.session;
          var expDesc = GT4_DESC[session] || session;
          banner.className = 'result-banner MISMATCH';
          banner.innerHTML = '⚠️ ДРУГАЯ СЕССИЯ!<br><span style="font-size:13px; font-weight:normal;">Шина числится в <b>[' + t.session + ' — ' + curDesc + ']</b>.<br>Выбрана: [' + session + ' — ' + expDesc + ']</span>';
          if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        } else {
          t.scanned = cleanScan;
          t.status = 'OK';
          saveDB();

          syncQueue.push({
            scannerId: myScannerId,
            className: cls,
            carNumber: car,
            barcode: cleanScan,
            targetBarcode: t.barcode,
            session: t.session || session,
            time: new Date().getTime()
          });
          saveDB();
          updateQueueUI();
          syncWithCloud();

          var sessLabel = isGT4 && t.session ? '<br><small style="color:#a5d6a7;">[' + t.session + ': ' + (GT4_DESC[t.session] || '') + ']</small>' : '';

          if (matchResult.matchType === 'EXACT') {
            banner.className = 'result-banner OK';
            banner.innerHTML = '✓ ШИНА OK<br><span style="font-size:14px; font-weight:normal;">' + cleanScan + ' (' + t.slot + ')' + sessLabel + '</span>';
            if (navigator.vibrate) navigator.vibrate(150);
          } else {
            banner.className = 'result-banner FUZZY';
            banner.innerHTML = '⚠️ ШИНА OK (ДОПУСК)<br><span style="font-size:13px; font-weight:normal;">Скан: ' + cleanScan + ' → База: <b>' + t.barcode + '</b>' + sessLabel + '<br><small>' + matchResult.note + '</small></span>';
            if (navigator.vibrate) navigator.vibrate([120, 70, 120]);
          }
        }
      } else {
        banner.className = 'result-banner MISMATCH';
        banner.innerHTML = '✕ НЕСООТВЕТСТВИЕ!<br><span style="font-size:14px; font-weight:normal;">Шина ' + cleanScan + ' отсутствует у #' + car + '</span>';
        if (navigator.vibrate) navigator.vibrate(800);
      }

      if (autoResetTimer) clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(function() {
        banner.style.display = 'none';
        banner.className = 'result-banner';
        var bInp = document.getElementById('barcodeInput');
        if (bInp) bInp.focus();
      }, 5000);
    }

    function findMatchingTire(cleanScan, tires, session, isGT4) {
      if (!cleanScan || cleanScan.length < 5) return null;

      if (isGT4 && session && session !== 'ALL') {
        for (var i = 0; i < tires.length; i++) {
          if (tires[i].session === session && String(tires[i].barcode).trim() === cleanScan) {
            return { tire: tires[i], matchType: 'EXACT', note: 'Точное совпадение' };
          }
        }
      }

      for (var j = 0; j < tires.length; j++) {
        if (String(tires[j].barcode).trim() === cleanScan) {
          return { tire: tires[j], matchType: 'EXACT', note: 'Точное совпадение' };
        }
      }

      for (var k = 0; k < tires.length; k++) {
        var decl = String(tires[k].barcode || '').trim();
        if (decl.length >= 6 && cleanScan.length >= decl.length - 2 && cleanScan.length < decl.length) {
          if (decl.indexOf(cleanScan) !== -1) {
            return { tire: tires[k], matchType: 'FUZZY', note: 'Не досканировано ' + (decl.length - cleanScan.length) + ' цифры' };
          }
        }
      }

      for (var m = 0; m < tires.length; m++) {
        var dVal = String(tires[m].barcode || '').trim();
        if (!dVal || dVal.length < 5) continue;
        var dist = getLevenshtein(cleanScan, dVal);
        if (dist === 1) {
          return { tire: tires[m], matchType: 'FUZZY', note: 'Погрешность в 1 цифре' };
        }
      }

      return null;
    }

    function getLevenshtein(a, b) {
      var al = a.length, bl = b.length;
      if (al === 0) return bl;
      if (bl === 0) return al;
      var m = [];
      for (var i = 0; i <= bl; i++) m[i] = [i];
      for (var j = 0; j <= al; j++) m[0][j] = j;

      for (var r = 1; r <= bl; r++) {
        for (var c = 1; c <= al; c++) {
          m[r][c] = b.charAt(r - 1) === a.charAt(c - 1)
            ? m[r - 1][c - 1]
            : Math.min(m[r - 1][c - 1] + 1, m[r][c - 1] + 1, m[r - 1][c] + 1);
        }
      }
      return m[bl][al];
    }

    function syncWithCloud() {
      if (!navigator.onLine) return;

      if (syncQueue.length > 0) {
        var payload = {
          action: 'batchSync',
          sheetId: activeSheetId,
          scans: syncQueue.slice(0)
        };

        var xhr = new XMLHttpRequest();
        xhr.open('POST', SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              var resp = JSON.parse(xhr.responseText);
              if (resp.success) {
                syncQueue = [];
                saveDB();
                updateQueueUI();
                pullRemoteUpdates();
              }
            } catch(e) {}
          }
        };
        xhr.send(JSON.stringify(payload));
      } else {
        pullRemoteUpdates();
      }
    }

    function pullRemoteUpdates() {
      if (!navigator.onLine) return;

      var url = SCRIPT_URL + '?action=pull&sheetId=' + encodeURIComponent(activeSheetId) + '&t=' + new Date().getTime();
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var cloudData = JSON.parse(xhr.responseText);
            if (cloudData && cloudData.classes) {
              mergeCloudState(cloudData.classes);
            }
          } catch(e) {}
        }
      };
      xhr.send();
    }

    function mergeCloudState(cloudClasses) {
      var changed = false;
      for (var cls in cloudClasses) {
        if (!localDB.classes[cls]) continue;
        for (var car in cloudClasses[cls]) {
          if (!localDB.classes[cls][car]) continue;

          var cloudTires = cloudClasses[cls][car];
          var localTires = localDB.classes[cls][car];

          for (var i = 0; i < cloudTires.length && i < localTires.length; i++) {
            if (cloudTires[i].status === 'OK' && localTires[i].status !== 'OK') {
              localTires[i].status = 'OK';
              localTires[i].scanned = cloudTires[i].scanned || cloudTires[i].barcode;
              changed = true;
            }
          }
        }
      }
      if (changed) {
        saveDB();
        renderCarsGrid();
      }
    }

    function forceSync() {
      updateNetStatus();
      if (!navigator.onLine) {
        alert('Нет подключения к интернету/сети Wi-Fi!');
        return;
      }
      syncWithCloud();
      alert('Запрос синхронизации отправлен!');
    }

    function renderCarsGrid() {
      var cls = document.getElementById('listClassSelect').value;
      var grid = document.getElementById('carsGrid');
      grid.innerHTML = '';

      if (!localDB.classes[cls]) return;

      var nums = [];
      for (var k in localDB.classes[cls]) {
        if (localDB.classes[cls].hasOwnProperty(k)) nums.push(k);
      }
      nums.sort(function(a, b) { return Number(a) - Number(b); });

      for (var i = 0; i < nums.length; i++) {
        var carNum = nums[i];
        var tires = localDB.classes[cls][carNum];
        var total = tires.length;
        var scanned = 0;
        for (var j = 0; j < tires.length; j++) {
          if (tires[j].status === 'OK') scanned++;
        }

        var statusClass = 'status-yellow';
        if (scanned > 0 && scanned === total) statusClass = 'status-green';

        var div = document.createElement('div');
        div.className = 'car-badge ' + statusClass;
        div.innerHTML = '#' + carNum + '<span class="badge-sub">' + scanned + '/' + total + '</span>';
        div.setAttribute('data-cls', cls);
        div.setAttribute('data-car', carNum);
        div.onclick = function() {
          openCarModal(this.getAttribute('data-cls'), this.getAttribute('data-car'));
        };
        grid.appendChild(div);
      }
    }

    function openCarModal(cls, carNum) {
      var modal = document.getElementById('carDetailModal');
      document.getElementById('modalCarTitle').innerText = 'Автомобиль #' + carNum;
      document.getElementById('modalCarSub').innerText = 'Класс: ' + cls;
      var list = document.getElementById('modalTireList');
      list.innerHTML = '';

      var tires = (localDB.classes[cls] && localDB.classes[cls][carNum]) ? localDB.classes[cls][carNum] : [];

      for (var i = 0; i < tires.length; i++) {
        var t = tires[i];
        var isOk = (t.status === 'OK');
        var row = document.createElement('div');
        row.className = 'tire-item ' + (isOk ? 'ok' : 'pending');

        var sessTag = t.session ? '<div style="font-size:10px; color:#ff9800; font-weight:bold;">[' + t.session + '] ' + (GT4_DESC[t.session] || '') + '</div>' : '';
        var bText = t.barcode ? t.barcode : 'не внесена';

        row.innerHTML = '<div class="tire-left">' +
          sessTag +
          '<div style="font-weight:bold;">' + (t.slot || ('Шина ' + (i+1))) + '</div>' +
          '<div style="font-size:11px; color:#aaa;">Штрихкод: <b>' + bText + '</b></div>' +
          '</div>' +
          '<div class="tire-right">' +
          '<span class="badge-pill ' + (isOk ? 'badge-ok' : 'badge-pending') + '">' + (isOk ? '✓ ОК' : 'ОЖИДАЕТ') + '</span>' +
          '</div><div class="clearfix"></div>';

        list.appendChild(row);
      }

      document.getElementById('modalResetCarBtn').onclick = function() {
        if (confirm('Сбросить отметки сканирования для машины #' + carNum + '?')) {
          for (var r = 0; r < tires.length; r++) {
            tires[r].scanned = '';
            tires[r].status = '';
          }
          saveDB();
          openCarModal(cls, carNum);
          renderCarsGrid();
        }
      };

      document.getElementById('modalInspectBtn').onclick = function() {
        closeCarModal();
        document.getElementById('classSelect').value = cls;
        onClassChange();
        document.getElementById('carSelect').value = carNum;
        showTab('scan');
      };

      modal.style.display = 'block';
    }

    function closeCarModal(e) {
      if (!e || e.target.id === 'carDetailModal' || e.target.className === 'modal-close') {
        document.getElementById('carDetailModal').style.display = 'none';
      }
    }

    function resetCurrentClassSession() {
      var cls = document.getElementById('listClassSelect').value;
      if (!localDB.classes[cls]) return;

      if (confirm('Сбросить отметки шин в классе "' + cls + '" для перехода в новую сессию?')) {
        for (var car in localDB.classes[cls]) {
          var tires = localDB.classes[cls][car];
          for (var i = 0; i < tires.length; i++) {
            tires[i].scanned = '';
            tires[i].status = '';
          }
        }
        saveDB();
        renderCarsGrid();
        alert('Класс ' + cls + ' готов к новой сессии!');
      }
    }

    function loadStageFromGoogleSheet() {
      var sheetId = document.getElementById('cloudSheetIdInput').value.trim();
      if (!sheetId) {
        alert('Укажите ID Google Таблицы этапа!');
        return;
      }
      if (!navigator.onLine) {
        alert('Нет подключения к интернету!');
        return;
      }

      if (!confirm('Загрузить соревнование из Google Таблицы? База обновится.')) return;

      var url = SCRIPT_URL + '?sheetId=' + encodeURIComponent(sheetId) + '&t=' + new Date().getTime();
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.classes && Object.keys(data.classes).length > 0) {
                localDB = {
                  stageName: data.sheetTitle || 'Этап: ' + sheetId.substring(0, 8),
                  classes: data.classes
                };
                activeSheetId = sheetId;
                try { localStorage.setItem('rskg_sheet_id', sheetId); } catch(e) {}
                syncQueue = [];
                saveDB();
                populateClassSelectors();
                renderCarsGrid();
                document.getElementById('stageTitle').innerText = localDB.stageName;
                alert('Этап успешно загружен из Google: ' + localDB.stageName);
              } else {
                alert('Не удалось прочитать классы. Проверьте права доступа таблицы (Все, у кого есть ссылка).');
              }
            } catch(e) {
              alert('Ошибка обработки ответа: ' + e.toString());
            }
          } else {
            alert('Ошибка сети: ' + xhr.status);
          }
        }
      };
      xhr.send();
    }

    // ИМПОРТ ИЗ ЛОКАЛЬНЫХ ФАЙЛОВ (.XLSX, .XLS, .CSV, .JSON)
    function importLocalStageFile(e) {
      var file = e.target.files[0];
      if (!file) return;

      var ext = file.name.toLowerCase();

      // Чтение Excel файлов .xlsx и .xls
      if (ext.indexOf('.xlsx') !== -1 || ext.indexOf('.xls') !== -1) {
        if (typeof XLSX === 'undefined') {
          alert('Библиотека XLSX не найдена!\n\nДля автономного чтения .xlsx на ТСД:\n1. Положите файл xlsx.full.min.js в ту же папку на карту памяти.\nИЛИ\n2. Подключитесь к Wi-Fi на 10 сек (библиотека скачается сама).\nИЛИ\n3. Сохраните таблицу как .csv (CSV читается всегда без интернета).');
          return;
        }

        var reader = new FileReader();
        reader.onload = function(evt) {
          try {
            var data = new Uint8Array(evt.target.result);
            var workbook = XLSX.read(data, {type: 'array'});
            var parsedDb = {};

            for (var s = 0; s < workbook.SheetNames.length; s++) {
              var sheetName = workbook.SheetNames[s];
              var worksheet = workbook.Sheets[sheetName];
              var rows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});

              var isGT4 = (sheetName.toUpperCase().indexOf('GT4') !== -1);
              var declCol = isGT4 ? 3 : 2;
              var currentCar = null;
              var currentSession = '';
              parsedDb[sheetName] = {};

              for (var r = 0; r < rows.length; r++) {
                var row = rows[r];

                for (var c = 0; c < row.length - 1; c++) {
                  if (String(row[c] || '').toLowerCase().indexOf('номер автомобиля') !== -1) {
                    var rawNum = row[c + 1] !== '' ? row[c + 1] : row[c + 2];
                    var carNum = String(rawNum || '').replace(/[^0-9]/g, '');
                    if (carNum) {
                      currentCar = carNum;
                      currentSession = '';
                      parsedDb[sheetName][currentCar] = [];
                    } else {
                      currentCar = null;
                      currentSession = '';
                    }
                    break;
                  }
                }

                if (currentCar) {
                  if (isGT4) {
                    var col0 = String(row[0] || '').trim().toUpperCase();
                    if (col0.indexOf('S0') !== -1) currentSession = 'S0';
                    else if (col0.indexOf('S1') !== -1 && col0.indexOf('ПРЕД') === -1 && col0.indexOf('S0') === -1) currentSession = 'S1';
                    else if (col0.indexOf('S2') !== -1) currentSession = 'S2';
                    else if (col0.indexOf('S3') !== -1) currentSession = 'S3';
                    else if (col0.indexOf('S4') !== -1) currentSession = 'S4';
                    else if (col0.indexOf('JOKER') !== -1) currentSession = 'JOKER';
                  }

                  var slotLabel = String(row[1] || '').trim();
                  if (slotLabel.toLowerCase().indexOf('шина') !== -1) {
                    var bVal = String(row[declCol] || '').replace(/[^0-9]/g, '');
                    parsedDb[sheetName][currentCar].push({
                      session: isGT4 ? currentSession : '',
                      slot: slotLabel,
                      barcode: bVal,
                      scanned: '',
                      status: ''
                    });
                  }
                }
              }
            }

            localDB = {
              stageName: file.name.replace(/\.[^/.]+$/, ""),
              classes: parsedDb
            };
            syncQueue = [];
            saveDB();
            populateClassSelectors();
            renderCarsGrid();
            document.getElementById('stageTitle').innerText = localDB.stageName;
            alert('Этап успешно загружен из XLSX файла: ' + localDB.stageName);
          } catch(err) {
            alert('Ошибка разбора файла XLSX: ' + err.toString());
          }
        };
        reader.readAsArrayBuffer(file);
        return;
      }

      // Чтение текстовых файлов (.json и .csv)
      var textReader = new FileReader();
      textReader.onload = function(evt) {
        var content = evt.target.result;
        try {
          if (ext.indexOf('.json') !== -1) {
            var parsed = JSON.parse(content);
            localDB = parsed.classes ? parsed : { stageName: file.name.replace('.json',''), classes: parsed };
          } else {
            localDB = parseCSVStage(content, file.name);
          }
          syncQueue = [];
          saveDB();
          populateClassSelectors();
          renderCarsGrid();
          document.getElementById('stageTitle').innerText = localDB.stageName;
          alert('Этап успешно загружен: ' + localDB.stageName);
        } catch(err) {
          alert('Ошибка чтения файла: ' + err.toString());
        }
      };
      textReader.readAsText(file, 'UTF-8');
    }

    function parseCSVStage(csvText, fileName) {
      var lines = csvText.split(/\r\n|\n/);
      var db = {};
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var parts = line.split(';');
        if (parts.length < 5) parts = line.split(',');
        if (parts.length >= 5) {
          var cls = parts[0].trim();
          var car = parts[1].trim();
          var sess = parts[2].trim();
          var slot = parts[3].trim();
          var bcode = parts[4].trim();

          if (!db[cls]) db[cls] = {};
          if (!db[cls][car]) db[cls][car] = [];

          db[cls][car].push({
            session: sess,
            slot: slot,
            barcode: bcode,
            scanned: '',
            status: ''
          });
        }
      }
      return { stageName: fileName.replace('.csv',''), classes: db };
    }

    function exportStageToJSON() {
      var jsonStr = JSON.stringify(localDB);
      var blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = (localDB.stageName || "RSKG_Stage") + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function createCleanStage() {
      if (!confirm('Создать новый "Чистый этап"? База очистится, классы будут готовы к добавлению участников.')) return;
      var stageName = prompt('Введите название этапа:', 'Новый этап');
      if (!stageName) return;

      var cleanClasses = {
        'Touring Light': {},
        'Touring': {},
        'Super Prod': {},
        'GT4': {}
      };
      localDB = { stageName: stageName, classes: cleanClasses };
      syncQueue = [];
      saveDB();
      populateClassSelectors();
      renderCarsGrid();
      document.getElementById('stageTitle').innerText = stageName;
      alert('Чистый этап создан. Добавьте участников во вкладке "Шины" → "+ Машина".');
    }

    function exportDataToCSV() {
      var csv = "\uFEFFКласс;Номер;Сессия;Слот;Заявленный_код;Скан_код;Статус\r\n";
      for (var c in localDB.classes) {
        for (var car in localDB.classes[c]) {
          var tires = localDB.classes[c][car];
          for (var i = 0; i < tires.length; i++) {
            var t = tires[i];
            csv += c + ";" + car + ";" + (t.session || '') + ";" + (t.slot || '') + ";" + (t.barcode || '') + ";" + (t.scanned || '') + ";" + (t.status || 'НЕ_ПРОВЕРЕНО') + "\r\n";
          }
        }
      }

      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", (localDB.stageName || "RSKG") + "_Report.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function checkPass() {
      var p = document.getElementById('regPass').value;
      if (p !== '1337') {
        alert('Неверный пароль 1337!');
        return false;
      }
      return true;
    }

    function showSubTab(tab) {
      var tabs = ['tire', 'addCar', 'delCar', 'extra'];
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var cap = t.charAt(0).toUpperCase() + t.slice(1);
        var b = document.getElementById('subBlock' + cap);
        var btn = document.getElementById('subTab' + cap + 'Btn');
        if (b) b.style.display = (t === tab) ? 'block' : 'none';
        if (btn) btn.className = (t === tab) ? 'active' : '';
      }
    }

    function submitTireRegistration() {
      if (!checkPass()) return;
      var cls = document.getElementById('regClassSelect').value;
      var car = document.getElementById('regCarSelect').value;
      var barcode = document.getElementById('regBarcodeInput').value.replace(/[^0-9]/g, '');
      var session = document.getElementById('regSessionSelect') ? document.getElementById('regSessionSelect').value : '';
      var banner = document.getElementById('regResultBanner');

      if (!car || !barcode) {
        alert('Выберите номер и отсканируйте штрихкод!');
        return;
      }

      banner.style.display = 'block';
      var tires = (localDB.classes[cls] && localDB.classes[cls][car]) ? localDB.classes[cls][car] : [];
      var slotFound = false;

      for (var i = 0; i < tires.length; i++) {
        var t = tires[i];
        if (cls.toUpperCase().indexOf('GT4') !== -1 && session && t.session !== session) continue;
        if (!t.barcode) {
          t.barcode = barcode;
          slotFound = true;
          banner.className = 'result-banner OK';
          banner.innerHTML = 'Шина ' + barcode + ' внесена в ' + t.slot;
          saveDB();
          break;
        }
      }

      if (!slotFound) {
        banner.className = 'result-banner MISMATCH';
        banner.innerHTML = 'Все слоты шин машины #' + car + ' уже заняты!';
      }

      document.getElementById('regBarcodeInput').value = '';
      setTimeout(function() {
        var inp = document.getElementById('regBarcodeInput');
        if (inp) inp.focus();
      }, 200);
    }

    // ДОБАВЛЕНИЕ МАШИНЫ С ПОДДЕРЖКОЙ СОЗДАНИЯ НОВОГО КЛАССА
    function submitAddCar() {
      if (!checkPass()) return;
      var clsSelect = document.getElementById('addCarClassSelect').value;
      var cls = clsSelect;

      if (clsSelect === '__NEW__') {
        cls = document.getElementById('newClassNameInput').value.trim();
        if (!cls) {
          alert('Введите название нового класса!');
          return;
        }
      }

      var car = document.getElementById('addCarNumber').value.replace(/[^0-9]/g, '');
      var isGT4 = (cls.toUpperCase().indexOf('GT4') !== -1);
      var quota = parseInt(document.getElementById('addCarTireQuota').value, 10) || 6;

      if (!car) { alert('Укажите номер машины!'); return; }
      if (!localDB.classes[cls]) localDB.classes[cls] = {};

      if (localDB.classes[cls][car]) {
        alert('Машина #' + car + ' уже есть в классе ' + cls);
        return;
      }

      localDB.classes[cls][car] = [];
      if (isGT4) {
        var schema = DEFAULT_STAGE_DATA.GT4_SCHEMA;
        for (var i = 0; i < schema.length; i++) {
          localDB.classes[cls][car].push({
            barcode: '',
            slot: schema[i][1],
            session: schema[i][0],
            scanned: '',
            status: ''
          });
        }
      } else {
        for (var j = 1; j <= quota; j++) {
          localDB.classes[cls][car].push({
            barcode: '',
            slot: 'Шина ' + j,
            session: '',
            scanned: '',
            status: ''
          });
        }
      }

      saveDB();
      populateClassSelectors();

      // Устанавливаем добавленный класс в селекторах
      document.getElementById('classSelect').value = cls;
      onClassChange();
      document.getElementById('addCarClassSelect').value = cls;
      onAddCarClassSelectChange();

      alert('Машина #' + car + ' успешно добавлена в класс: ' + cls);
      document.getElementById('addCarNumber').value = '';
      document.getElementById('newClassNameInput').value = '';
    }

    function submitDeleteCar() {
      if (!checkPass()) return;
      var cls = document.getElementById('delCarClassSelect').value;
      var car = document.getElementById('delCarSelect').value;

      if (!car) return;
      if (!confirm('Удалить машину #' + car + ' из класса ' + cls + '?')) return;

      delete localDB.classes[cls][car];
      saveDB();
      populateClassSelectors();
      alert('Машина #' + car + ' удалена');
    }

    function submitAddExtraTire() {
      if (!checkPass()) return;
      var cls = document.getElementById('extraClassSelect').value;
      var car = document.getElementById('extraCarSelect').value;
      var barcode = document.getElementById('extraBarcodeInput').value.replace(/[^0-9]/g, '');

      if (!car) return;
      var count = localDB.classes[cls][car].length + 1;
      localDB.classes[cls][car].push({
        barcode: barcode,
        slot: 'Доп. шина ' + count,
        session: (cls.toUpperCase().indexOf('GT4') !== -1) ? 'S0' : '',
        scanned: '',
        status: ''
      });

      saveDB();
      alert('Добавлен слот доп. шины #' + count);
      document.getElementById('extraBarcodeInput').value = '';
    }

    function showTab(tab) {
      document.getElementById('tabScan').style.display = (tab === 'scan') ? 'block' : 'none';
      document.getElementById('tabList').style.display = (tab === 'list') ? 'block' : 'none';
      document.getElementById('tabReg').style.display = (tab === 'reg') ? 'block' : 'none';
      document.getElementById('tabStage').style.display = (tab === 'stage') ? 'block' : 'none';

      document.getElementById('tabScanBtn').className = (tab === 'scan') ? 'active' : '';
      document.getElementById('tabListBtn').className = (tab === 'list') ? 'active' : '';
      document.getElementById('tabRegBtn').className = (tab === 'reg') ? 'active' : '';
      document.getElementById('tabStageBtn').className = (tab === 'stage') ? 'active' : '';

      if (tab === 'list') renderCarsGrid();
      if (tab === 'scan') {
        var inp = document.getElementById('barcodeInput');
        if (inp) inp.focus();
      }
    }
  </script>
