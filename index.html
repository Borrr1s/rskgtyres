<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>РСКГ Шинный Контроль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #111; color: #fff; padding: 10px; max-width: 500px; margin: 0 auto; -webkit-tap-highlight-color: transparent; }
    
    /* Статус-бар сети и очереди */
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; font-weight: bold; border: 1px solid #333; }
    .badge-sync { padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .online { color: #4caf50; }
    .offline { color: #ff9800; }

    /* Навигация */
    .nav { display: flex; gap: 6px; margin-bottom: 10px; }
    .nav button { flex: 1; padding: 12px 2px; background: #222; color: #888; border: 1px solid #333; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .nav button.active { background: #007bff; color: #fff; border-color: #007bff; }

    .card { background: #1a1a1a; padding: 14px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2d2d2d; }
    label { font-size: 12px; color: #aaa; margin-top: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 12px; margin-top: 4px; background: #262626; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
    
    /* МАССИВНАЯ КНОПКА КАМЕРЫ */
    .btn-massive {
      width: 100%;
      min-height: 64px;
      padding: 16px;
      margin: 12px 0;
      background: linear-gradient(135deg, #ff9800, #e65100);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(230, 81, 0, 0.4);
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-massive.active { background: #d32f2f; color: #fff; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.5); }
    .btn-massive:active { transform: scale(0.98); }

    .btn-action { width: 100%; padding: 12px; background: #28a745; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; }

    /* Окно видоискателя камеры */
    #scanner-wrapper { display: none; margin-bottom: 12px; border-radius: 12px; overflow: hidden; border: 2px solid #ff9800; background: #000; position: relative; }
    #camera-feed { width: 100%; min-height: 250px; }

    /* Большой статус-экран проверки */
    .result-banner { margin-top: 10px; padding: 20px; border-radius: 12px; text-align: center; font-size: 22px; font-weight: 900; display: none; line-height: 1.3; }
    .result-banner.OK { background: #1b5e20; color: #a5d6a7; border: 2px solid #28a745; }
    .result-banner.MISMATCH { background: #b71c1c; color: #ffcdd2; border: 2px solid #f44336; }

    /* Сетка пилотов */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 8px; }
    .car-badge { padding: 12px 2px; text-align: center; border-radius: 8px; font-weight: bold; font-size: 18px; }
    .status-green { background: #28a745; color: #fff; }
    .status-red { background: #dc3545; color: #fff; }
    .status-yellow { background: #ffc107; color: #111; }
    .badge-sub { font-size: 11px; display: block; font-weight: normal; margin-top: 2px; opacity: 0.9; }
  </style>
</head>
<body>

  <!-- Верхний индикатор синхронизации -->
  <div class="status-bar">
    <div id="netStatus" class="online">● ОНЛАЙН</div>
    <div id="queueStatus" class="badge-sync" onclick="syncWithCloud()">Очередь: 0 ⟳</div>
  </div>

  <div class="nav">
    <button id="tabScanBtn" class="active" onclick="showTab('scan')">Проверка</button>
    <button id="tabListBtn" onclick="showTab('list')">Сетка</button>
    <button id="tabRegBtn" onclick="showTab('reg')">Внесение</button>
  </div>

  <!-- ВКЛАДКА 1: ПРОВЕРКА (СКАНЕР) -->
  <div id="tabScan">
    <div class="card">
      <label>Класс:</label>
      <select id="classSelect" onchange="onClassChange()"></select>

      <div id="sessionWrapper" style="display: none;">
        <label>Сессия (для GT4):</label>
        <select id="sessionSelect">
          <option value="S0">S0 (Свободная тренировка)</option>
          <option value="S1">S1 (Квалификация)</option>
          <option value="S2">S2 (Гонка 1)</option>
          <option value="S3">S3 (Гонка 2)</option>
        </select>
      </div>

      <label>Номер машины:</label>
      <input type="text" id="carNumber" list="carsList" placeholder="Выбери или начни вводить" inputmode="numeric">
      <datalist id="carsList"></datalist>

      <!-- МАССИВНАЯ КНОПКА ПОТОКОВОГО СКАНЕРА -->
      <button id="toggleCamBtn" class="btn-massive" onclick="toggleContinuousCamera()">
        📷 ВКЛЮЧИТЬ КАМЕРУ
      </button>

      <!-- Живой видоискатель -->
      <div id="scanner-wrapper">
        <div id="camera-feed"></div>
      </div>

      <label>Штрихкод (сканер CipherLab / ввод):</label>
      <input type="text" id="barcodeInput" placeholder="Сканируй триггером ТСД">
      <button class="btn-action" onclick="processManualInput()">Сверить вручную</button>
    </div>

    <div id="resultBanner" class="result-banner"></div>
  </div>

  <!-- ВКЛАДКА 2: СЕТКА МАШИН -->
  <div id="tabList" style="display: none;">
    <div class="card">
      <label>Класс:</label>
      <select id="listClassSelect" onchange="renderCarsGrid()"></select>
    </div>
    <div class="grid" id="carsGrid"></div>
  </div>

  <!-- ВКЛАДКА 3: РЕГИСТРАЦИЯ ШИН -->
  <div id="tabReg" style="display: none;">
    <div class="card">
      <label>Пароль доступа:</label>
      <input type="password" id="regPass" placeholder="Пароль">

      <label>Класс:</label>
      <select id="regClassSelect" onchange="onRegClassChange()"></select>

      <div id="regSessionWrapper" style="display: none;">
        <label>Сессия (для GT4):</label>
        <select id="regSessionSelect">
          <option value="S0">S0 (Свободная тренировка)</option>
          <option value="S1">S1 (Квалификация)</option>
          <option value="S2">S2 (Гонка 1)</option>
          <option value="S3">S3 (Гонка 2)</option>
        </select>
      </div>

      <label>Номер машины:</label>
      <input type="text" id="regCarNumber" list="regCarsList" placeholder="Номер машины" inputmode="numeric">
      <datalist id="regCarsList"></datalist>

      <label>Штрихкод новой шины:</label>
      <input type="text" id="regBarcodeInput" placeholder="Сканируй ТСД или введи">

      <button class="btn-massive" style="background:#9c27b0; color:#fff;" onclick="submitTireRegistration()">
        ВНЕСТИ В ТАБЛИЦУ
      </button>
    </div>
    <div id="regResultBanner" class="result-banner"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyC9MW5uiCpXmo1APugPa63jm-TgBX4eKetJOCvpajbnJYDf1rX7pGiBpV9jVuJWhkH/exec';

    let localDB = JSON.parse(localStorage.getItem('rskg_db') || '{"classes":{}}');
    let syncQueue = JSON.parse(localStorage.getItem('rskg_queue') || '[]');
    let html5QrCode = null;
    let isCameraRunning = false;
    let scanCooldown = false;
    let audioCtx = null;

    window.onload = function() {
      updateNetworkStatus();
      updateQueueUI();
      populateClassSelectors();
      
      // Авто-фоновый запрос свежей базы
      fetchCloudDB();
// Enter для лазерного сканера CipherLab RS30
      document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          processManualInput();
        }
      });
      document.getElementById('regBarcodeInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitTireRegistration();
        }
      });

      window.addEventListener('online', () => { updateNetworkStatus(); syncWithCloud(); });
      window.addEventListener('offline', updateNetworkStatus);
    };

    function updateNetworkStatus() {
      const netEl = document.getElementById('netStatus');
      if (navigator.onLine) {
        netEl.className = 'online';
        netEl.innerText = '● ОНЛАЙН';
      } else {
        netEl.className = 'offline';
        netEl.innerText = '○ ОФЛАЙН';
      }
    }

    function updateQueueUI() {
      const qEl = document.getElementById('queueStatus');
      qEl.innerText = Очередь: ${syncQueue.length} ⟳;
      qEl.style.color = syncQueue.length > 0 ? '#ff9800' : '#888';
    }

    // Загрузка базы данных в локальный кэш телефона
    function fetchCloudDB() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data && data.classes) {
            localDB = data;
            localStorage.setItem('rskg_db', JSON.stringify(localDB));
            populateClassSelectors();
            renderCarsGrid();
          }
        })
        .catch(err => console.log("Офлайн режим, используем кэш базы"));
    }

    function populateClassSelectors() {
      const classes = Object.keys(localDB.classes);
      if (classes.length === 0) return;

      ['classSelect', 'listClassSelect', 'regClassSelect'].forEach(id => {
        const el = document.getElementById(id);
        const cur = el.value;
        el.innerHTML = '';
        classes.forEach(c => el.add(new Option(c, c)));
        if (cur && classes.includes(cur)) el.value = cur;
      });

      onClassChange();
      onRegClassChange();
    }

    function onClassChange() {
      const cls = document.getElementById('classSelect').value;
      document.getElementById('sessionWrapper').style.display = (cls === 'GT4') ? 'block' : 'none';
      updateDatalist(cls, 'carsList');
    }

    function onRegClassChange() {
      const cls = document.getElementById('regClassSelect').value;
      document.getElementById('regSessionWrapper').style.display = (cls === 'GT4') ? 'block' : 'none';
      updateDatalist(cls, 'regCarsList');
    }

    function updateDatalist(cls, listId) {
      const dl = document.getElementById(listId);
      dl.innerHTML = '';
      if (!localDB.classes[cls]) return;
      
      const numbers = Object.keys(localDB.classes[cls]).sort((a, b) => Number(a) - Number(b));
      numbers.forEach(num => {
        const opt = document.createElement('option');
        opt.value = num;
        dl.appendChild(opt);
      });
    }

    // ПОТОКОВЫЙ СКАНЕР КАМЕРЫ (БЕЗ НАЖАТИЯ КНОПОК ФОТО)
    function toggleContinuousCamera() {
      const btn = document.getElementById('toggleCamBtn');
      const wrapper = document.getElementById('scanner-wrapper');

      if (isCameraRunning) {
        if (html5QrCode) {
          html5QrCode.stop().then(() => {
            wrapper.style.display = 'none';
            btn.className = 'btn-massive';
            btn.innerText = '📷 ВКЛЮЧИТЬ КАМЕРУ';
            isCameraRunning = false;
          });
        }
      } else {
        wrapper.style.display = 'block';
        btn.className = 'btn-massive active';
        btn.innerText = '⏹ ОСТАНОВИТЬ КАМЕРУ';

        html5QrCode = new Html5Qrcode("camera-feed");
        const config = {
          fps: 20,
          qrbox: { width: 280, height: 130 }
        };

        html5QrCode.start(
          { facingMode: "environment" },
          config,
          (barcode) => {
            if (!scanCooldown) {
              scanCooldown = true;
              triggerBeep();
              verifyTire(barcode);
              // Задержка 1.5 сек перед следующим сканированием, чтобы не дублировать
              setTimeout(() => { scanCooldown = false; }, 1500);
            }
          },
          (err) => {}
        ).then(() => {
          isCameraRunning = true;
        }).catch(err => {
          alert('Ошибка доступа к камере: ' + err);
          toggleContinuousCamera();
        });
      }
    }

    function processManualInput() {
      const barcode = document.getElementById('barcodeInput').value;
      if (barcode) {
        triggerBeep();
        verifyTire(barcode);
      }
    }

    // МГНОВЕННАЯ ОФЛАЙН-СВЕРКА
    function verifyTire(barcode) {
      const cls = document.getElementById('classSelect').value;
      const car = document.getElementById('carNumber').value;
      const session = document.getElementById('sessionSelect').value;
      const banner = document.getElementById('resultBanner');

      if (!car) {
        alert('Сначала выберите номер машины!');
        return;
      }

      banner.style.display = 'block';
      const cleanBarcode = String(barcode).trim();
      const carTires = (localDB.classes[cls] && localDB.classes[cls][car]) ? localDB.classes[cls][car] : [];
      
      let matched = false;
      for (let t of carTires) {
        if (t.barcode === cleanBarcode) {
          if (cls === 'GT4' && session && !t.session.toLowerCase().includes(session.toLowerCase())) {
            continue;
          }
          matched = true;
          t.scanned = cleanBarcode;
          t.status = 'OK';
          break;
        }
      }

      if (matched) {
        banner.className = 'result-banner OK';
        banner.innerHTML = ✅ ОК<br><span style="font-size:16px;">Шина ${cleanBarcode}</span>;
        if (navigator.vibrate) navigator.vibrate(100);

        // Добавляем в очередь синхронизации
        syncQueue.push({ className: cls, carNumber: car, barcode: cleanBarcode, session: session });
        localStorage.setItem('rskg_queue', JSON.stringify(syncQueue));
        localStorage.setItem('rskg_db', JSON.stringify(localDB));
        updateQueueUI();
        syncWithCloud();
      } else {
        banner.className = 'result-banner MISMATCH';
        banner.innerHTML = ❌ НЕСООТВЕТСТВИЕ!<br><span style="font-size:15px;">Шина ${cleanBarcode} отсутствует в заявке машины #${car}</span>;
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }

      document.getElementById('barcodeInput').value = '';
    }

    // Фоновая отправка очереди в облако
    function syncWithCloud() {
      if (!navigator.onLine || syncQueue.length === 0) return;

      const payload = { action: 'batchSync', scans: [...syncQueue] };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          syncQueue = [];
          localStorage.setItem('rskg_queue', '[]');
          updateQueueUI();
        }
      })
      .catch(e => console.log('Синхронизация отложена (нет стабильной связи)'));
    }

    // Внесение шины
    function submitTireRegistration() {
      const pass = document.getElementById('regPass').value;
      const cls = document.getElementById('regClassSelect').value;
      const car = document.getElementById('regCarNumber').value;
      const barcode = document.getElementById('regBarcodeInput').value;
      const session = document.getElementById('regSessionSelect').value;
      const banner = document.getElementById('regResultBanner');

      if (pass !== '1337') {
        alert('Неверный пароль 1337!');
        return;
      }
      if (!car || !barcode) {
        alert('Заполните номер и штрихкод!');
        return;
      }

      banner.style.display = 'block';
      banner.className = 'result-banner';
      banner.innerText = 'Запись в таблицу...';
fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'registerTire', pass, className: cls, carNumber: car, barcode, session })
      })
      .then(res => res.json())
      .then(res => {
        banner.className = 'result-banner ' + (res.success ? 'OK' : 'MISMATCH');
        banner.innerText = res.message;
        if (res.success) {
          document.getElementById('regBarcodeInput').value = '';
          fetchCloudDB(); // Обновляем локальную базу
        }
      });
    }

    // Сетка пилотов
    function renderCarsGrid() {
      const cls = document.getElementById('listClassSelect').value;
      const grid = document.getElementById('carsGrid');
      grid.innerHTML = '';

      if (!localDB.classes[cls]) return;

      const cars = Object.keys(localDB.classes[cls]).sort((a, b) => Number(a) - Number(b));
      cars.forEach(carNum => {
        const tires = localDB.classes[cls][carNum];
        const total = tires.length;
        const scanned = tires.filter(t => t.status === 'OK').length;
        
        let statusClass = 'status-yellow';
        if (scanned > 0 && scanned === total) statusClass = 'status-green';

        const div = document.createElement('div');
        div.className = car-badge ${statusClass};
        div.innerHTML = #${carNum}<span class="badge-sub">${scanned}/${total}</span>;
        div.onclick = () => {
          document.getElementById('classSelect').value = cls;
          document.getElementById('carNumber').value = carNum;
          showTab('scan');
        };
        grid.appendChild(div);
      });
    }

    function showTab(tab) {
      document.getElementById('tabScan').style.display = tab === 'scan' ? 'block' : 'none';
      document.getElementById('tabList').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('tabReg').style.display = tab === 'reg' ? 'block' : 'none';

      document.getElementById('tabScanBtn').className = tab === 'scan' ? 'active' : '';
      document.getElementById('tabListBtn').className = tab === 'list' ? 'active' : '';
      document.getElementById('tabRegBtn').className = tab === 'reg' ? 'active' : '';

      if (tab === 'list') renderCarsGrid();
    }

    // Звуковой бип через Web Audio API
    function triggerBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz (нота Ля)
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }
  </script>
</body>
</html>
